[package]
name = "focus-matrix"
version = "0.2.0"
description = "A calm Eisenhower matrix for Windows"
authors = ["Focus Matrix"]
edition = "2021"
license = "MIT"
repository = "https://github.com/keykonor/focus-matrix"

[lib]
name = "focus_matrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls-no-alpn", "system-proxy"] }
tokio = { version = "1", features = ["sync"] }
getrandom = "0.3"
sha2 = "0.10"
