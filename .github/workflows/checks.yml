name: Source and tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate public source and release metadata
        run: npm run release:check
      - name: Frontend tests in three local time zones
        shell: bash
        run: |
          set -euo pipefail
          for zone in UTC Asia/Shanghai America/Los_Angeles; do
            echo "Testing local calendar behavior in $zone"
            TZ="$zone" npm test
          done
      - name: Source snapshot tests
        run: npm run version:test
      - name: Private source policy regression tests
        run: npm run test:source-policy
      - name: Frontend production build
        run: npm run build
      - name: Cloud gateway tests
        run: node --test cloud-gateway/test.mjs
