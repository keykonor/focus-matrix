name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a Release after all checks pass
        type: boolean
        default: false
      tag:
        description: Release tag matching the desktop version
        type: string
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || 'v0.2.0' }}
      RELEASE_PUBLISH: ${{ inputs.publish }}
      REQUIRE_SIGNPATH: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust MSVC toolchain
        id: rust
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$(rustc --version)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.REQUIRE_SIGNPATH != 'true'
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-2022-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate public source and release metadata
        shell: pwsh
        run: |
          npm run release:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/validate-release-ref.ps1
      - name: Release ref regression tests
        shell: pwsh
        run: ./scripts/test-release-ref.ps1
      - name: Frontend tests
        shell: pwsh
        run: |
          foreach ($zone in @('UTC', 'Asia/Shanghai', 'America/Los_Angeles')) {
            $env:TZ = $zone
            Write-Output "Testing local calendar behavior in $zone"
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Source snapshot tests
        run: npm run version:test
      - name: Complete snapshot and installer preparation tests
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-update-preservation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer-preparation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native persistence and history tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Isolated midnight archive and UI checks
        run: npm run check:completed
      - name: Build official embedded-frontend program
        run: npm run tauri build -- --no-bundle
      - name: Bundle Windows x64 NSIS installer
        run: npm run tauri bundle -- --bundles nsis --ci
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.REQUIRE_SIGNPATH != 'true' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Select installer and prepare signing input
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          "path=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT
          if ($env:REQUIRE_SIGNPATH -eq 'true') {
            if ($env:GITHUB_REF -cne 'refs/heads/main' -and -not $env:GITHUB_REF.StartsWith('refs/tags/v')) {
              throw 'SignPath releases must be built from main or a release tag.'
            }
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "version=$version" >> $env:GITHUB_OUTPUT
            New-Item -ItemType Directory -Path outputs/signpath-input | Out-Null
            Copy-Item -LiteralPath $installers[0].FullName -Destination outputs/signpath-input/FocusMatrix-Windows-x64-setup.exe
          }
      - name: Upload unsigned installer for SignPath
        if: env.REQUIRE_SIGNPATH == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-matrix-signpath-input
          path: outputs/signpath-input/FocusMatrix-Windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath
        if: env.REQUIRE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: outputs/signpath-signed
          parameters: |
            version: ${{ toJSON(steps.installer.outputs.version) }}
      - name: Verify and package the final installer, then test data preservation
        shell: pwsh
        env:
          UNSIGNED_INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $requireSignPath = $env:REQUIRE_SIGNPATH -eq 'true'
          $installer = $env:UNSIGNED_INSTALLER
          if ($requireSignPath) { $installer = 'outputs/signpath-signed/FocusMatrix-Windows-x64-setup.exe' }
          ./scripts/package-windows-release.ps1 -Installer $installer -RequireSignPath:$requireSignPath
          $asset = Get-Item -LiteralPath outputs/release/FocusMatrix-Windows-x64-setup.exe
          ./scripts/check-windows-installer.ps1 -Installer $asset.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: outputs/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: release
      - name: Verify assets and publish once
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo 'Existing source tag differs from the tested build; refusing publication.'
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          printf '\n[Code signing policy](https://github.com/%s/blob/main/docs/code-signing.md)\n' "$GITHUB_REPOSITORY" >> release-notes.md
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --target "$GITHUB_SHA" --title "Focus Matrix ${RELEASE_TAG#v}" \
            --notes-file release-notes.md --latest
